<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette Emails</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!--
  Maquette du nouveau style des emails (01/10). Principe : même langage que le site public refait (maquette-page-produit.html).
  Aujourd'hui : texte de 13 à 14 px sans titre, police système, cadres dorés, fonds colorés, vert/rouge/orange, liens bleus.
  Nouveau : un grand titre, texte de 16 px, lignes séparées par des filets, aucune boîte, uniquement marine et or,
  liens marine soulignés, bouton doré (inchangé), tout aligné à gauche, logo seul en en-tête (règle V2 conservée).
  Trois emails du flux actuel : rappel avant le vol, créneau confirmé, paiement par virement. Le texte « actuel » est le vrai rendu des gabarits.
  Poppins ne s'affiche que dans Apple Mail (Gmail ignore les polices web) : repli sur Segoe UI / Arial.
-->
<style>
:root{--navy:#0b2238;--gold:#F2B705;--sec:#edf0f7;--fg:#1e2535;--muted:#64748b;--border:#e0e5ef}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:#dfe3ea;color:var(--fg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.tool{position:sticky;top:0;z-index:2000;background:#fff;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;font-size:12px}
.tool b{font-weight:800;font-size:13px}
.tool .lbl{color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--sec);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stage{display:flex;justify-content:center;gap:56px;padding:32px 24px 56px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center}
.col h2{margin:0 0 14px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.col h2 em{font-style:normal;color:var(--navy)}
/* iPhone : 390 px de large à l'intérieur du cadre */
.phone{width:414px;height:844px;border:12px solid #0f1115;border-radius:56px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.28);position:relative;overflow:hidden;display:flex;flex-direction:column}
.phone .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:32px;background:#0f1115;border-radius:20px;z-index:3}
.phone .status{height:54px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:15px;font-weight:700;color:#111827}
.phone .status .sys{font-size:12px;letter-spacing:1px}
.phone .mailhdr{flex:none;padding:8px 16px 10px;border-bottom:1px solid #eef0f2}
.phone .mailhdr .row1{display:flex;align-items:center;gap:10px}
.phone .mailhdr .av{width:34px;height:34px;border-radius:50%;background:#f04e23;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.phone .mailhdr .who{font-size:14px;font-weight:700;color:#111827;line-height:1.2}
.phone .mailhdr .who small{display:block;font-weight:500;font-size:12px;color:#6b7280}
.phone .mailhdr .subj{margin-top:8px;font-size:15px;font-weight:700;color:#111827;line-height:1.3}
.phone iframe{flex:1;width:100%;min-height:0;border:0;background:#fff}
.phone .home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#0f1115;z-index:3}
/* ordinateur : le mail dans une fenêtre de 680 px */
.desk{width:680px;height:900px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.14);display:flex;flex-direction:column;overflow:hidden}
.desk .mailhdr{padding:12px 18px;border-bottom:1px solid #eef0f2;font-size:13px;color:#6b7280}
.desk .mailhdr b{display:block;color:#111827;font-size:15px;margin-bottom:2px}
.desk iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<div class="tool">
  <b>Maquette · Style des emails</b>
  <span class="lbl">Email</span>
  <div class="seg" id="em"><button data-e="rappel" class="on">Rappel avant le vol</button><button data-e="confirme">Créneau confirmé</button><button data-e="paiement">Paiement par virement</button></div>
  <span class="lbl">Écran</span>
  <div class="seg" id="vw"><button data-v="phone" class="on">iPhone</button><button data-v="desk">Ordinateur</button></div>
  <span class="lbl">Logo</span>
  <div class="seg" id="lg"><button data-l="bottom" class="on">En bas</button><button data-l="top">En haut</button></div>
  <span class="lbl">Accent</span>
  <div class="seg" id="ac"><button data-a="1" class="on">Filet doré au-dessus du titre</button><button data-a="0">Aucun</button></div>
</div>
<div class="stage" id="stage"></div>

  } else {
    box.className = "desk";
    box.innerHTML = '<div class="mailhdr"><b></b>De : Fly Horizons</div>';
    box.querySelector("b").textContent = subj;
    box.appendChild(f);
  }
  return box;
}

function render() {
  const st = document.getElementById("stage"); st.innerHTML = "";
  [["Actuel", CURRENT[state.e]], ["Nouveau", NEW[state.e](state.a)]].forEach(([label, html], i) => {
    const col = document.createElement("div"); col.className = "col";
    col.innerHTML = "<h2>" + (i ? "<em>Nouveau</em>" : "Actuel") + "</h2>";
    col.appendChild(frame(html, SUBJ[state.e], state.v));
    st.appendChild(col);
  });
}
function seg(id, key, parse) {
  const el = document.getElementById(id);
  el.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button"); if (!btn) return;
    el.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === btn));
    state[key] = parse(btn); render();
  });
}
seg("em", "e", (x) => x.dataset.e); seg("vw", "v", (x) => x.dataset.v); seg("ac", "a", (x) => Number(x.dataset.a)); seg("lg", "l", (x) => x.dataset.l);
render();
</script>
