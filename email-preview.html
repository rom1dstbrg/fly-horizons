ge.png\" alt=\"Fly Horizons\" width=\"148\"\n                    style=\"display:block;margin:0 auto;width:148px;height:auto;border:0;outline:none;\" />\n                  <img class=\"em-logo-dark\" src=\"https://fly-horizons.com/logo-email-white.png\" alt=\"\" width=\"120\"\n                    style=\"display:none;margin:0 auto;width:120px;height:auto;border:0;max-height:0;overflow:hidden;mso-hide:all;\" />\n                </td>\n              </tr>\n            </table>\n          </td>\n        </tr>\n      </table>\n    </td>\n  </tr>\n</table>\n</body>\n</html>","error":null,"side":"public","category":"Pilotes","rank":2},{"n":40,"fn":"flightOfferExpiredAdminEmail","label":"Vols sans preneur après 48h (notification admin)","line":2587,"subject":"Vol sans preneur · Fly Horizons","html":"<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n<title>Vol sans preneur · Fly Horizons</title>\n</head>\n<body style=\"margin:0;padding:24px 16px;background-color:#ffffff;font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:#1e2535;\">\n  <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td align=\"center\">\n    <table width=\"480\" cellpadding=\"0\" cellspacing=\"0\" style=\"max-width:480px;width:100%;\">\n      <tr><td style=\"font-size:14px;line-height:1.6;\">\n        \n    <p style=\"margin:0 0 16px;font-size:16px;font-weight:700;\">2 vols sans preneur</p>\n    <p style=\"margin:0 0 12px;\">Aucun pilote n'a pris ces vols dans les 48&nbsp;h. À gérer à la main.</p>\n    <p style=\"margin:0 0 6px;font-size:13px;\">samedi 3 octobre 2026 à 14:00</p><p style=\"margin:0 0 6px;font-size:13px;\">dimanche 4 octobre 2026</p>\n    <p style=\"margin:20px 0 0;\"><a href=\"https://fly-horizons.com/admin/vols\" style=\"color:#1d5fbf;font-weight:600;\">Ouvrir les vols &rarr;</a></p>\n      </td></tr>\n    </table>\n  </td></tr></table>\n</body>\n</html>","error":null,"side":"admin","category":"Pilotes","rank":5},{"n":41,"fn":"piloteReleasedFlightAdminEmail","label":"Un pilote rend un vol attribué → notification admin","line":2615,"subject":"Un pilote a rendu un vol · Fly Horizons","html":"<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n<title>Un pilote a rendu un vol · Fly Horizons</title>\n</head>\n<body style=\"margin:0;padding:24px 16px;background-color:#ffffff;font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:#1e2535;\">\n  <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr><td align=\"center\">\n    <table width=\"480\" cellpadding=\"0\" cellspacing=\"0\" style=\"max-width:480px;width:100%;\">\n      <tr><td style=\"font-size:14px;line-height:1.6;\">\n        \n    <p style=\"margin:0 0 16px;font-size:16px;font-weight:700;\">Un pilote a rendu un vol</p>\n    <p style=\"margin:0 0 12px;\">Julien Verhaegen a rendu ce vol. Il n'est plus attribué à personne, il faut le réassigner.</p>\n    <p style=\"margin:0 0 6px;font-size:13px;color:#1e2535;\"><strong>Client&nbsp;:</strong> Sophie Delcourt</p>\n    <p style=\"margin:0 0 6px;font-size:13px;color:#1e2535;\"><strong>Date&nbsp;:</strong> samedi 3 octobre 2026 à 14:00</p>\n    <p style=\"margin:20px 0 0;\"><a href=\"https://fly-horizons.com/admin/vols\" style=\"color:#1d5fbf;font-weight:600;\">Ouvrir les vols &rarr;</a></p>\n      </td></tr>\n    </table>\n  </td></tr></table>\n</body>\n</html>","error":null,"side":"admin","category":"Pilotes","rank":6}];
const PUBLIC_CATEGORIES = ["Réservation standard","Vol sur mesure","Annonces pilote","Pilotes","Messagerie & Contact","Newsletter","Divers"];
const ADMIN_CATEGORIES = ["Contact","Vol sur mesure","Post-vol","Pilotes"];

let activeSide = "public";
let current = null;
let device = "phone";
let theme = "light";
try { device = localStorage.getItem("fhPreviewDevice") || "phone"; theme = localStorage.getItem("fhPreviewTheme") || "light"; } catch (err) {}

// Sombre : on active les règles @media (prefers-color-scheme: dark) de l'email. Gmail sombre (simulé) : inversion naïve
// des couleurs, images ré-inversées : sert à repérer un logo ou un texte qui disparaîtrait, pas à juger le rendu exact.
function themed(html) {
  // Les nouveaux logos ne sont en ligne qu'après le déploiement : dans l'aperçu on lit les fichiers du dossier public/.
  html = html.split("https://fly-horizons.com/logo-email-").join("public/logo-email-");
  if (theme === "dark") return html.split("@media (prefers-color-scheme: dark)").join("@media all");
  if (theme === "gmail") return html.replace("</head>", "<style>html{filter:invert(1) hue-rotate(180deg);background:#fff} img{filter:invert(1) hue-rotate(180deg)}</style></head>");
  return html;
}
function updateThemeSeg() {
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.t === theme));
  document.getElementById("frameWrap").style.background = theme === "light" ? "" : "#1b1f27";
}

function escHtml(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function updateDevSeg() {
  document.querySelectorAll("#devSeg button").forEach(b => b.classList.toggle("on", b.dataset.d === device));
}

function countSide(side) { return ENTRIES.filter(e => e.side === side).length; }

function updateTabs() {
  document.getElementById("tabPublic").textContent = "Public (" + countSide("public") + ")";
  document.getElementById("tabAdmin").textContent = "Admin (" + countSide("admin") + ")";
  document.getElementById("tabPublic").className = "tab" + (activeSide === "public" ? " active" : "");
  document.getElementById("tabAdmin").className = "tab" + (activeSide === "admin" ? " active" : "");
}

function matches(e, f) {
  if (!f) return true;
  const hay = (e.n + " " + e.fn + " " + e.label + " " + e.category).toLowerCase();
  return hay.indexOf(f) !== -1;
}

function renderList(filter) {
  const f = (filter || "").toLowerCase();

  // Si le côté actif n'a aucun résultat mais l'autre en a, on bascule automatiquement.
  if (f) {
    const activeHas = ENTRIES.some(e => e.side === activeSide && matches(e, f));
    const otherSide = activeSide === "public" ? "admin" : "public";
    const otherHas = ENTRIES.some(e => e.side === otherSide && matches(e, f));
    if (!activeHas && otherHas) activeSide = otherSide;
  }
  updateTabs();

  const list = document.getElementById("list");
  list.innerHTML = "";
  const cats = activeSide === "admin" ? ADMIN_CATEGORIES : PUBLIC_CATEGORIES;

  cats.forEach(cat => {
    const items = ENTRIES
      .filter(e => e.side === activeSide && e.category === cat && matches(e, f))
      .sort((a, b) => a.rank - b.rank);
    if (items.length === 0) return;

    const head = document.createElement("div");
    head.className = "cat-head";
    head.textContent = cat;
    list.appendChild(head);

    items.forEach(e => {
      const row = document.createElement("div");
      row.className = "row" + (e.n === current ? " active" : "");
      row.innerHTML = '<div class="n">' + (e.error ? '<span class="warn">⚠ </span>' : '') + '#' + e.n + ' — ' + e.label + '</div><div class="fn">' + e.fn + '</div>';
      row.onclick = () => select(e.n);
      list.appendChild(row);
    });
  });
}

function select(n) {
  current = n;
  const e = ENTRIES.find(x => x.n === n);
  if (!e) return;
  activeSide = e.side;
  document.getElementById("subject").textContent = e.subject;
  document.getElementById("meta").innerHTML = e.fn + "() · lib/email-templates.ts:" + e.line + (e.side === "admin" ? ' <span class="badge-side admin">Admin</span>' : "");
  const wrap = document.getElementById("frameWrap");
  wrap.innerHTML = "";
  if (e.error) {
    const box = document.createElement("div");
    box.className = "error-box";
    box.textContent = "Erreur lors du rendu de cet email :\n\n" + e.error;
    wrap.appendChild(box);
  } else {
    const iframe = document.createElement("iframe");
    iframe.setAttribute("sandbox", "allow-same-origin");
    iframe.srcdoc = themed(e.html);
    wrap.classList.toggle("phone-mode", device === "phone");
    if (device === "phone") {
      const phone = document.createElement("div");
      phone.className = "phone";
      phone.innerHTML =
        '<div class="island"></div>' +
        '<div class="status"><span>9:41</span><span class="sys">&#9679;&#9679;&#9679;&#9679; 5G &#9646;</span></div>' +
        '<div class="mailhdr"><div class="row1"><div class="av">F</div><div class="who">Fly Horizons<small>à moi</small></div></div>' +
        '<div class="subj">' + escHtml(e.subject) + '</div></div>';
      phone.appendChild(iframe);
      phone.insertAdjacentHTML("beforeend", '<div class="home"></div>');
      wrap.appendChild(phone);
    } else {
      wrap.appendChild(iframe);
    }
  }
  updateDevSeg();
  updateThemeSeg();
  renderList(document.getElementById("search").value);
}

document.getElementById("themeSeg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  theme = b.dataset.t;
  try { localStorage.setItem("fhPreviewTheme", theme); } catch (err) {}
  if (current != null) select(current);
});
document.getElementById("devSeg").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  device = b.dataset.d;
  try { localStorage.setItem("fhPreviewDevice", device); } catch (err) {}
  if (current != null) select(current);
});
document.getElementById("tabPublic").addEventListener("click", () => { activeSide = "public"; renderList(document.getElementById("search").value); });
document.getElementById("tabAdmin").addEventListener("click", () => { activeSide = "admin"; renderList(document.getElementById("search").value); });
document.getElementById("search").addEventListener("input", (ev) => renderList(ev.target.value));

renderList("");
const first = ENTRIES.filter(e => e.side === "public").sort((a, b) => PUBLIC_CATEGORIES.indexOf(a.category) - PUBLIC_CATEGORIES.indexOf(b.category) || a.rank - b.rank)[0];
if (first) select(first.n);
</script>
</body>
